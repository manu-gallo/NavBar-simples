<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>

<h1>Cadastro</h1>
<p>Formulário de cadastro de alunos.</p>

<form action="sucesso.html" method="get">
        
<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" required><br><br>
        
<label for="email">E-mail:</label>
<input type="email" id="email" name="email" required><br><br>

<label for="idade">Idade:</label>
<input type="number" id="idade" name="idade" required><br><br>

<label for="curso">Curso:</label>
<select id="curso" name="curso" required>
    <option value="">Selecione um curso</option>
    <option>Informática</option>
    <option>Enfermagem</option>
    <option>Marketing Digital</option>
    <option>Gastronomia</option>
    <option>Contabilidade</option>
</select><br><br>

<label for="turno">Turno/Período:</label>
<select id="turno" name="turno" required>
    <option value="">Selecione</option>
    <option>Manhã</option>
    <option>Tarde</option>
    <option>Noite</option>
</select><br><br>

<label for="interesses">Interesses:</label><br>
<input type="checkbox" name="interesses"> Tecnologia<br>
<input type="checkbox" name="interesses"> Saúde<br>
<input type="checkbox" name="interesses"> Negócios<br>
<input type="checkbox" name="interesses"> Gastronomia<br><br>

<input type="submit" value="Enviar">
<label for="senha">Senha:</label>
<input type="password" id="senha" name="senha" required><br><br>

<label for="data">Data de Nascimento:</label>
<input type="date" id="data" name="data" required><br><br>

<label for="telefone">Telefone:</label>
<input type="tel" id="telefone" name="telefone" required><br><br>

    </select><br><br>
    <input type="submit" value="Cadastrar">
    
    </form>
<a href="index.html">
    <button>Voltar para o Início</button>
</a>
</body>
</html>
